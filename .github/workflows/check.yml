name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: doctor
        run: python3 -m engine check
      - name: sample verse
        run: python3 -m engine "بقره ۹۱"
